# ==============================================================================
# Nginx Server Configuration for SIPPD Kota Tasikmalaya
# Production-ready configuration with SSL, Security Headers, and FastCGI Hardening
# ==============================================================================

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name sippd.tasikmalayakota.go.id; # Ganti dengan domain resmi

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/sippd/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sippd.tasikmalayakota.go.id; # Ganti dengan domain resmi

    root /var/www/sippd/public;
    index index.php index.html;

    # SSL Certificates (Sesuaikan path sertifikat SSL dari Diskominfo / Let's Encrypt)
    ssl_certificate /etc/ssl/certs/sippd_bundle.crt;
    ssl_certificate_key /etc/ssl/private/sippd.key;

    # SSL Hardening (TLSv1.2 & TLSv1.3 only, Secure Ciphers)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Server Tokens & Identification
    server_tokens off;

    # Maximum Body / Upload Size
    client_max_body_size 25M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Security Headers (Defense-in-depth on Web Server level)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Charset
    charset utf-8;

    # Logging
    access_log /var/log/nginx/sippd_access.log combined;
    error_log  /var/log/nginx/sippd_error.log warn;

    # Block access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to sensitive files
    location ~* \.(env|log|sql|md|yml|yaml|json|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Disable direct execution of PHP files inside uploaded/storage directories
    location ~ ^/(storage|uploads)/.*\.php$ {
        deny all;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Laravel Front Controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Sesuaikan dengan versi PHP server produksi
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Hide X-Powered-By from upstream PHP
        fastcgi_hide_header X-Powered-By;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }
}

